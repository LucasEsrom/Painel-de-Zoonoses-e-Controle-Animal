name: Publicar dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dados/dashboard.json
      - exportar_dashboard.py
      - dashboard_atualizado.html
      - tests/**
      - .github/workflows/preparar-dashboard.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar exportador
        run: python -m unittest discover -s tests -v
      - name: Validar dados do painel
        run: python -m json.tool dados/dashboard.json > /dev/null
      - name: Preparar página
        run: |
          mkdir -p dist/dados
          cp dashboard_atualizado.html dist/index.html
          cp dados/dashboard.json dist/dados/dashboard.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
